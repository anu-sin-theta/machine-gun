[package]
name = "kavach-wasm"
description = "WASM bindings over kavach-core's JSON API"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# wasm-bindgen's generated glue uses `unsafe`, so the workspace-wide
# `unsafe_code = "forbid"` is not inherited here. The hand-written code below
# contains none. The clippy panic-safety lints still apply.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[dependencies]
kavach-core = { path = "../kavach-core" }
wasm-bindgen = "=0.2.130"
